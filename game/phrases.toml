[phrase."/Lotus/Language/Upgrades/VoidBondAlacrityFieldModDesc"]
en = "If the Companion exceeds |SHIELDTHRESHOLD| Max Shields or Overshields then your fire rate is increased |FIRERATE|%. Reloading restores |SHIELD| Overshields to your companion."
ru = "Если у компаньона максимальное значение щитов или сверхщитов превышает |SHIELDTHRESHOLD|, ваша скорострельность увеличивается на |FIRERATE|%. Перезарядка восстанавливает вашему компаньону |SHIELD| сверхщитов."

[phrase."/Lotus/Language/Upgrades/VoidBondBondedExaltationModDesc"]
en = "While a channeled Ability is active, Companion melee attacks create a |RANGE|m shockwave for |DAMAGEPCT|% of their melee attack damage. Damage dealt by your Companion increases your Ability Efficiency by |EFFICIENCY|% for |DURATION| seconds. Max |MAXSTACKS| stacks."
ru = "Пока активна потоковая способность, атаки компаньона в ближнем бою создают ударную волну длиной |RANGE| м, наносящую |DAMAGEPCT|% урона от атаки в ближнем бою. Урон, нанесённый вашим компаньоном, увеличивает энергоэффективность на |EFFICIENCY|% на |DURATION| сек. Максимум — |MAXSTACKS| стаков."

[phrase."/Lotus/Language/Upgrades/VoidBondBoneSplitterModDesc"]
en = "Companion melee attacks strip |ARMORSTRIP|% of enemy armor. Enemies recently damaged by Abilities spread the effect to other enemies in a |RANGE|m radius."
ru = "Атаки компаньона в ближнем бою снимают |ARMORSTRIP|% брони противника. Враги, недавно получившие урон от способностей, распространяют этот эффект на других врагов в радиусе |RANGE| м."

[phrase."/Lotus/Language/Upgrades/VoidBondCompoundingLacerationModDesc"]
en = "Companion Precept Mods apply Status Effects from Companion weapons. Killing enemies with <LOWER_IS_BETTER>|STATUSCOUNT| or more unique Status Effects reduces Companion Ability cooldowns by |COOLDOWNREDUCTION|s."
ru = "Моды-заповеди компаньона накладывают эффекты статуса от оружия компаньона. Убийство врагов с <LOWER_IS_BETTER>|STATUSCOUNT| или более уникальными статусными эффектами сокращает время восстановления способностей компаньона на |COOLDOWNREDUCTION| сек."

[phrase."/Lotus/Language/Upgrades/VoidBondCopilotModDesc"]
en = "Airborne kills decrease Companion Recovery Time by |TIMER|s and |TIMERHEADSHOT|s for headshot kills. Companion creates a field of cold that increases up to |MAXSTATUS|% and |MAXRANGE|m radius while Warframe is airborne, lasting for |DURATION|s after returning to ground."
ru = "Убийства в воздухе уменьшают время восстановления компаньона на |TIMER| с, а при убийствах попаданием в голову — |TIMERHEADSHOT| с. Компаньон создаёт холодовое поле, которое усиливается до |MAXSTATUS|% и в радиусе до |MAXRANGE| м, пока варфрейм находится в воздухе и длится |DURATION| сек. после возвращения на землю."

[phrase."/Lotus/Language/Upgrades/VoidBondEximusHunterModDesc"]
en = "Killing Eximus enemies grants |DAMAGE|% bonus of a random Elemental Damage to your Companion for |DURATION|s and reduces Companion Recovery Time by |TIME|s."
ru = "Убийство эксимусов даёт вашему спутнику |DAMAGE|% бонуса к случайному элементальному урону на |DURATION| с и снижает время восстановления компаньона на |TIME| с."

[phrase."/Lotus/Language/Upgrades/VoidBondMutualNourishmentModDesc"]
en = "Health Orbs restore |HEALING| more health and reduce Companion Recovery Time by |TIME|s."
ru = "Сферы здоровья восстанавливают ещё |HEALING| единиц здоровья и уменьшают время восстановления компаньона на |TIME| сек."

[phrase."/Lotus/Language/Upgrades/VoidBondPredatoryResponseModDesc"]
en = "Finisher and Mercy Kills grant your Companion |TIMER|s of stealth that attacks will not disrupt. Max |DURATION|s."
ru = "Убийства с добиванием и Милосердием дают вашему компаньону |TIMER| сек. скрытности, которая не зависит от входящих атак. Максимальная длительность — |DURATION| сек."

[phrase."/Lotus/Language/Upgrades/VoidBondPreyDriveModDesc"]
en = "After your Companion uses Abilities with cooldowns <LOWER_IS_BETTER>|CASTS| times, you may cast a Warframe Ability without expending Energy."
ru = "После того, как ваш компаньон использует способности с восстановлением <LOWER_IS_BETTER>|CASTS| раз, вы можете использовать способность варфрейма, не тратя энергию."

[phrase."/Lotus/Language/Upgrades/VoidBondProliferationModDesc"]
en = "When your Companion kills an enemy afflicted with a Status Effect, |SPREAD|% of the Status Effect spreads to other enemies within |RANGE|m. Max |STACKS| stacks."
ru = "Когда ваш компаньон убивает врага, на которого наложен эффект статуса, |SPREAD|% эффекта статуса распространяется на других врагов в радиусе |RANGE| м. Складывается макс. |STACKS| раз."

[phrase."/Lotus/Language/Upgrades/VoidBondTandemTacticsModDesc"]
en = "Companion melee hits increase your Combo by |COMBO|. Heavy Attacks increase Companion melee damage by |DAMAGEPCT|% multiplied by your combo multiplier for |DURATION|s."
ru = "Удары компаньона в ближнем бою увеличивают ваше комбо на |COMBO|. Тяжёлые атаки увеличивают урон компаньона в ближнем бою на |DAMAGEPCT|% от текущего значения, умноженного на множитель комбо, на |DURATION| сек."

[phrase."/Lotus/Language/Upgrades/VoidBondTenaciousPartnerModDesc"]
en = "Headshot kills reduce Companion Recovery timer by |TIMER|s. If the Companion's Critical Chance is over |CRITTHRESHOLD|% then you gain +|CRITDAMAGE|x Final Critical Damage Multiplier."
ru = "Убийства в голову уменьшают время восстановления компаньона на |TIMER| сек. Если шанс критического урона компаньона превышает |CRITTHRESHOLD|%, вы получаете х|CRITDAMAGE| к конечному множителю критического урона."

[phrase."/Lotus/Language/Upgrades/VoidBondVoidCloneModDesc"]
en = "Companion will clone itself each time you expend |ENERGY| energy, up to |MAXCLONES| clones. Clones live |DURATION|s and cannot use Abilities. Their kills have a |ORBCHANCE|% chance of dropping Energy Orbs."
ru = "Компаньон будет клонировать себя каждый раз, когда вы тратите |ENERGY| энергии, максимум клонов — |MAXCLONES|. Клоны живут |DURATION| сек. и не могут использовать способности. Из их жертв с вероятностью |ORBCHANCE|% выпадут энергетические сферы."

[phrase."/Lotus/Language/Upgrades/VoidBondVoidVinculumModDesc"]
en = "Damage dealt by Operator or Drifter grants |DAMAGE|% damage and |VOIDDAMAGE|% <DT_RADIANT_COLOR>Void Damage to your Companion's attacks for |DURATION|s. Companion Void Damage adds +|EFFICIENCY|% Amp and Energy Efficiency to Operator or Drifter for |DURATION2|s."
ru = "Урон, наносимый оператором или скитальцем, увеличивает на |DAMAGE|% урон и |VOIDDAMAGE|% урон <DT_RADIANT_COLOR>Бездной от атак компаньона на |DURATION| с. Урон Бездны от компаньона добавляет |EFFICIENCY|% к эффективности усилителя и энергии оператору или скитальцу на |DURATION2| сек."

[phrase."/Lotus/Language/Upgrades/VoidDashRadius"]
