# Riven splicing (Update 44.1): two traits of a riven are consumed and give the spliced trait.
# Written by hand from the wiki's "Riven Mods" page, section Spliceable_Stats, in DE's stat tags.
# A splice applies to a riven class whose pool rolls all three stats; melee keys its damage and
# faction stats apart, so those splices are written twice.

# Rows of the wiki's splicing table when this file was last checked against it.
checked_rows = 22

# --- elements, every riven ---

[[splice]]
first = "WeaponFireDamageMod"
second = "WeaponFreezeDamageMod"
result = "WeaponBlastDamageMod"

