[[rule]]
kind = "resource"
reason = "parentName"
parent = [
  "/Lotus/Types/Items/MiscItems/ResourceItem",
  "/Lotus/Types/Gameplay/Duviri/Resource/DuviriBaseResourceItem",
  "/Lotus/Types/Gameplay/Zariman/Resources/VoidWraithItem",
  "/Lotus/Types/Gameplay/JadeShadows/Resources/AscensionResourceItem",
]

# --- ship, orbiter, captura ----------------------------------------------------------------

[[rule]]
kind = "ship-segment"
reason = "parentName"
parent_starts = ["/Lotus/Types/Items/ShipFeatureItems/"]

[[rule]]
kind = "navigation"
reason = "parentName"
parent = ["/Lotus/Types/Items/NavigationFeatureItem"]

[[rule]]
kind = "orbiter"
reason = "parentName"
parent = ["/Lotus/Types/Items/ShipItem", "/Lotus/Types/Game/CrewShip/CrewShip"]

[[rule]]
kind = "shawzin-song"
reason = "parentName"
parent = [
  "/Lotus/Types/Game/SongItem",
  "/Lotus/Types/Items/ShipDecos/LotusShawzinPlayableBase",
]

[[rule]]
kind = "captura"
reason = "parentName: photobooth tiles are capture scenes"
parent_starts = [
  "/Lotus/Types/Items/MiscItems/Photobooth",
  "/Lotus/Types/Game/PhotoboothTileItem",
  "/Lotus/Types/Items/DangerRoom/",
  "/Lotus/Types/Game/DangerRoomTileItem",
]

[[rule]]
kind = "simulacrum"
reason = "parentName"
parent_starts = ["/Lotus/Types/Game/SpectreArmyItem"]

[[rule]]
kind = "ship-deco"
reason = "parentName"
parent_starts = ["/Lotus/Types/Items/ShipDeco"]

# --- gear ----------------------------------------------------------------------------------

[[rule]]
kind = "fish-bait"
reason = "parentName"
parent_starts = ["/Lotus/Types/Game/FishBait/"]

[[rule]]
kind = "fishing-spear"
reason = "parentName"
parent_starts = ["/Lotus/Types/Restoratives/Consumable/BaseSpearFishing"]

[[rule]]
kind = "conservation-gear"
reason = "parentName"
parent_starts = ["/Lotus/Types/Restoratives/Conservation/"]

[[rule]]
kind = "spectre"
reason = "parentName"
parent_starts = [
  "/Lotus/Types/Game/SummonNpcItem",
  "/Lotus/Types/Restoratives/Consumable/SpectreBase",
]

[[rule]]
kind = "air-support"
reason = "parentName"
parent_starts = ["/Lotus/Types/Restoratives/LisetBase"]

[[rule]]
kind = "restorative"
reason = "parentName"
parent_starts = [
  "/Lotus/Types/Game/Restorative",
  "/Lotus/Types/Restoratives/Consumable/",
  "/Lotus/Types/Restoratives/Upgraded/",
]

[[rule]]
kind = "gear"
reason = "manifest"
array = ["ExportGear"]

# --- keys ----------------------------------------------------------------------------------

[[rule]]
kind = "quest-key"
reason = "path"
path_contains = ["Quest"]
array = ["ExportKeys"]

[[rule]]
kind = "key"
reason = "manifest"
array = ["ExportKeys"]

# --- appearance ----------------------------------------------------------------------------
# ExportCustoms and ExportFlavour carry no productCategory and no parentName, so the path
# folder is the only fact there is.

[[rule]]
kind = "sigil"
reason = "path"
path_contains = ["/Upgrades/Skins/Sigils/", "/Upgrades/Skins/Clan/"]

[[rule]]
kind = "syandana"
reason = "path: DE calls syandanas scarves"
path_contains = ["/Upgrades/Skins/Scarves/"]

[[rule]]
kind = "armor"
reason = "path"
path_contains = ["/Upgrades/Skins/Armor/"]

[[rule]]
kind = "operator-cosmetic"
reason = "path"
path_contains = ["/Upgrades/Skins/Operator/"]

[[rule]]
kind = "ephemera"
reason = "path"
path_contains = ["/Upgrades/Skins/Effects/"]

[[rule]]
kind = "liset-skin"
reason = "path"
path_contains = ["/Upgrades/Skins/Liset/"]

[[rule]]
kind = "pet-appearance"
reason = "path: pet fur patterns, colours and body types"
path_contains = ["/Types/Game/KubrowPet/", "/Types/Game/CatbrowPet/"]
array = ["ExportFlavour", "ExportCustoms"]

[[rule]]
kind = "glyph"
reason = "path"
path_contains = ["/Types/StoreItems/AvatarImages/"]

[[rule]]
kind = "title"
reason = "path"
path_contains = ["/Types/Items/Titles/"]

[[rule]]
kind = "emote"
reason = "path"
path_contains = ["/Types/Items/Emotes/", "/Types/Game/PoseSets/"]

[[rule]]
kind = "palette"
reason = "path"
path_contains = ["/Types/StoreItems/SuitCustomizations/"]

[[rule]]
kind = "ui-theme"
reason = "path"
path_contains = [
  "/Interface/Graphics/CustomUI/",
  "/Types/Items/VideoWallSoundscapes/",
]

[[rule]]
kind = "note-pack"
reason = "path"
path_contains = ["/Types/Game/NotePacks/"]

[[rule]]
kind = "diorama"
reason = "path"
path_contains = ["/Types/Game/ActionFigureDioramas/"]

[[rule]]
kind = "wallpaper"
reason = "path"
path_contains = ["/Types/Game/QuartersWallpapers/"]

[[rule]]
kind = "skin"
reason = "manifest: everything left in the appearance manifest is a skin"
array = ["ExportCustoms"]

[[rule]]
kind = "glyph"
reason = "manifest: everything left in the flavour manifest is a picture or a badge"
array = ["ExportFlavour"]

# --- fallback ------------------------------------------------------------------------------

[[rule]]
kind = "misc-resource"
reason = "parentName: DE's own junk drawer"
parent = ["/Lotus/Types/Items/MiscItems/MiscItemBase"]
fallback = true

[[rule]]
kind = "misc"
reason = "manifest"
array = ["ExportResources", "ExportDrones"]
fallback = true
