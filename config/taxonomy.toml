# --- blueprints ----------------------------------------------------------------------------
# First, so a blueprint is never taken for the thing it builds: its path is the item's path
# with a suffix, and several path rules below would match it.

[[rule]]
kind = "blueprint"
reason = "a recipe key the manifests never declare"
category = ["Blueprint"]

# --- weapons ------------------------------------------------------------------------------
# `productCategory` is the inventory slot, so it holds modular parts and exalted weapons
# beside ordinary guns. Those come out by path first.

[[rule]]
kind = "exalted-weapon"
reason = "a weapon under a warframe's own folder is summoned by an ability"
array = ["ExportWeapons"]
path_contains = ["/Lotus/Powersuits/"]

[[rule]]
kind = "exalted-weapon"
reason = "a weapon DE files as a special item is summoned, not owned"
array = ["ExportWeapons"]
category = ["SpecialItems"]

[[rule]]
kind = "zaw-part"
reason = "Ostron melee parts are Zaw components, filed under Pistols"
path_contains = ["/Weapons/Ostron/Melee/"]

[[rule]]
kind = "kitgun-part"
reason = "Solaris United secondary parts are Kitgun components"
path_contains = ["/Weapons/SolarisUnited/Secondary/"]

[[rule]]
kind = "amp-part"
reason = "operator amp components"
path_contains = ["/Weapons/Sentients/OperatorAmplifiers/", "/Weapons/Operator/"]
category = ["Pistols", "OperatorAmps"]

[[rule]]
kind = "kdrive-part"
reason = "hoverboard parts are filed under Pistols"
path_contains = ["/Types/Vehicles/Hoverboard/"]

[[rule]]
kind = "conservation-prey"
reason = "the wounded animal carried to the Necralisk, also filed under Pistols"
path_contains = ["/Types/Items/Deimos/WoundedInfested"]

# A Moa or a Hound has no entity of its own: DE only ships the parts, and the head is what
# names the model ("МОА: Пара", "Гончая: Дорма"). DE calls the Hound line ZanukaPets.

[[rule]]
kind = "moa"
reason = "path: the head names the Moa model"
path_contains = ["/MoaPets/MoaPetParts/MoaPetHead"]

[[rule]]
kind = "hound"
reason = "path: the head names the Hound model"
path_contains = ["/ZanukaPets/ZanukaPetParts/ZanukaPetPartHead"]

[[rule]]
kind = "moa-part"
reason = "path: core, gyro and bracket, filed under Pistols"
path_contains = ["/MoaPets/MoaPetParts/"]

[[rule]]
kind = "hound-part"
reason = "path: core, bracket and stabilizer, filed under Pistols"
path_contains = ["/ZanukaPets/ZanukaPetParts/"]

[[rule]]
kind = "pet-component"
reason = "path: antigens and mutagens breed an infested pet, they are not weapons"
path_contains = ["/CreaturePets/CreaturePetParts/"]

[[rule]]
kind = "companion-weapon"
reason = "productCategory: one slot for every robotic companion, so no split by carrier"
category = ["SentinelWeapons"]

[[rule]]
kind = "primary"
reason = "productCategory"
category = ["LongGuns"]

[[rule]]
kind = "secondary"
reason = "productCategory"
category = ["Pistols"]

[[rule]]
kind = "melee"
reason = "productCategory"
category = ["Melee"]

[[rule]]
kind = "arch-gun"
reason = "productCategory"
category = ["SpaceGuns"]

[[rule]]
kind = "arch-melee"
reason = "productCategory"
category = ["SpaceMelee"]

[[rule]]
kind = "railjack-weapon"
reason = "productCategory"
category = ["CrewShipWeapons"]

# --- warframes and companions -------------------------------------------------------------
# Every pet is `KubrowPets`; the species is in the path. Khora's Venari is `SpecialItems`.

[[rule]]
kind = "vulpaphyla"
reason = "path: an infested Catbrow is a Vulpaphyla"
path_contains = ["InfestedCatbrowPet"]
array = ["ExportSentinels"]

[[rule]]
kind = "predasite"
reason = "path: a predator Kubrow is a Predasite"
path_contains = ["PredatorKubrowPet"]
array = ["ExportSentinels"]

[[rule]]
kind = "kavat"
reason = "path: Catbrow is DE's name for a Kavat, and Khora's Venari is one too"
path_contains = ["/CatbrowPet/", "/Kavat/"]
array = ["ExportSentinels"]

[[rule]]
kind = "kubrow"
reason = "path"
path_contains = ["/KubrowPet/"]
array = ["ExportSentinels"]

[[rule]]
kind = "sentinel"
reason = "productCategory"
category = ["Sentinels"]

[[rule]]
kind = "archwing"
reason = "productCategory"
category = ["SpaceSuits"]

[[rule]]
kind = "necramech"
reason = "productCategory"
category = ["MechSuits"]

[[rule]]
kind = "warframe"
reason = "productCategory"
category = ["Suits"]
array = ["ExportWarframes"]

[[rule]]
kind = "warframe"
reason = "a suit DE files as a special item is still a warframe"
category = ["SpecialItems"]
array = ["ExportWarframes"]

# --- mods ---------------------------------------------------------------------------------
# `type` covers 1580 of 1597 mods. Rivens, Necramech, K-Drive and transmute cores print
# `---` or nothing, and Avionics and Focus ways sit in their own manifest arrays.

[[rule]]
kind = "railjack-mod"
reason = "manifest array"
array = ["ExportAvionics"]

[[rule]]
kind = "focus-way"
