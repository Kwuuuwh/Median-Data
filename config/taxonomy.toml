# How the catalog is grouped. Two axes only: a class (top level) and a kind (leaf).
#
# `[[class]]` declares the tree. Every kind slug is unique across classes, so a kind names
# its class on its own. Russian labels are data, not authority — they are curated like any
# other translation.
#
# `[[rule]]` derives an item's kind. Rules are ordered, first match wins, and each one says
# which DE fact it reads. A rule matches when every matcher it lists matches; within one
# matcher any listed value counts. Matchers:
#
#   array         the manifest array the object came from (`ExportAvionics`)
#   category      `productCategory`, or the manifest name when DE gives none
#   parent        `parentName`, exact
#   parent_starts `parentName`, prefix
#   path_contains substring of `uniqueName`
#   mod_type      `type`, which only mods carry (`STANCE`, `AURA`)
#
# An item no rule matches lands in `unknown`, which the funnel reports. A rule that catches
# what is left rather than recognising anything says `fallback = true`: what it assigns reads
# like a decision and is not one, so the funnel counts those items as unclassified too.

[[class]]
slug = "warframe"
en = "Warframes"
ru = "Варфреймы"
kind = [
  { slug = "warframe", en = "Warframe", ru = "Варфрейм" },
  { slug = "archwing", en = "Archwing", ru = "Арчвинг" },
  { slug = "necramech", en = "Necramech", ru = "Некрамех" },
]

