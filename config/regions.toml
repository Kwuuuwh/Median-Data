# Names for the numbers DE puts on a star-chart node. `ExportRegions` gives `missionIndex`,
# `factionIndex` and `nodeType` as bare integers and never says what they mean, so the labels
# live here. An index with no entry stays a number: the funnel reports it instead of guessing.
#
# The labels themselves were curated by hand in the previous project. Where the real data
# also confirms one, the check is written above its block: the drop tables print a node as
# `Planet/Node (Mission type)`, and the funnel re-reads that on every build.
#
# Russian is data, not authority — it is curated like any other translation.

# --- mission types -------------------------------------------------------------------------
