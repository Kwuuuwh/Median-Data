# --- factions ------------------------------------------------------------------------------
# Started from the previous project, then checked against the wiki node by node. Indices 0, 1
# and 2 came out the same three ways: the previous project, which planets hold them, and the
# wiki. Index 2 has a fourth witness — all 26 Dark Sector nodes carry it.
#
# `wiki = "..."` records a disagreement looked at and kept, so the check stays quiet until the
# wiki changes its mind.

[[faction]]
index = 0
en = "Grineer"
ru = "Гринир"

[[faction]]
index = 1
en = "Corpus"
ru = "Корпус"

[[faction]]
index = 2
en = "Infested"
ru = "Заражённые"

# Index 3 holds the Void, Lua and the Dark Refractory. The enemies there are the Corrupted;
# Orokin built the place but is not who you fight. Derived here from the planets, and the wiki
# says Corrupted on 21 of these nodes.

[[faction]]
index = 3
en = "Corrupted"
ru = "Искажённые"

# Index 10 is only the two Duviri nodes. The wiki calls their enemy The Murmur, which is not
# what Duviri fields; its own faction table lists Duviri as a faction, so that is the label
# until something better names it.

[[faction]]
index = 10
en = "Duviri"
ru = "Дувири"
wiki = "The Murmur"

# Index 5 is one node: The Ropalolyst. The wiki calls its enemy Corpus because the level is
# full of Corpus, but the node's own faction is Sentient — that is the boss and the point of
# the mission. Kept against the wiki on purpose.

[[faction]]
index = 5
en = "Sentient"
ru = "Владеющие Разумом"
wiki = "Corpus"

# Index 11 is one node: Vesper Relay. A relay is Tenno-held, which is what the wiki says.

[[faction]]
index = 11
en = "Tenno"
ru = "Тенно"

[[faction]]
index = 7
en = "The Murmur"
ru = "Шёпот"

[[faction]]
index = 8
en = "Scaldra"
ru = "Скальдра"

[[faction]]
index = 9
en = "Techrot"
ru = "Техрот"

