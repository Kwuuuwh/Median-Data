# Areas a player stays in and gathers across: a hub with its open world, or the missions played
# out of it. A star-chart node belongs by its tileset, and a place by the node it names, its
# bounty settlement, the location the drop tables print, or by name. Vendors are listed by key,
# area by area, once someone has checked where each one stands. A mine names the manifest
# that rolls an open world's veins and the place the catalog shows them as.

[[area]]
key = "duviri"
name = "Duviri"
ru = "Дувири"
tilesets = ["Duviri", "Dormizone"]
locations = ["Duviri"]
places = [
    "Duviri Circuit",
    "Duviri Full Experience",
    "Duviri Full Experience (Steel Path)",
    "Duviri Lone Story",
    "Duviri Lone Story (Steel Path)",
    "Duviri Murmur Invasion Rewards",
    "Duviri Murmur Invasion Rewards (Steel Path)",
    "Duviri Static Undercroft Portal",
    "Duviri Static Undercroft Portal (Steel Path)",
    "Kullervo's Hold",
]
vendors = ["acrithis", "teshin-s-cave"]

